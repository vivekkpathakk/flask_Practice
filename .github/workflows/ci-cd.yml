name: Flask GitHub Actions Pipeline

on:
  push:
    branches: [ "main", "staging" ]
  release:
    types: [ published ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run Tests
        run: python -m pytest -v
      - name: Build Application Package
        run: |
          mkdir -p build
          rsync -av --exclude='build' --exclude='.git' --exclude='.github' ./ build/
          cd build && tar -czf ../app-build.tar.gz . && cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: flask-app-build
          path: app-build.tar.gz

  deploy-staging:
    needs: build-and-test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flask-app-build
      - name: Deploy to Staging
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          KEY: ${{ secrets.DEPLOY_KEY }}
        run: echo "Deploying to staging server $HOST (simulated)"

  deploy-production:
    needs: build-and-test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flask-app-build
      - name: Deploy to Production
        env:
          HOST: ${{ secrets.PROD_HOST }}
          KEY: ${{ secrets.DEPLOY_KEY }}
        run: echo "Deploying to production server $HOST (simulated)"
