name: Flask GitHub Actions Pipeline

on:
  push:
    branches: [ "main", "staging" ]
  release:
    types: [ published ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: "mongodb://localhost:27017/dummy_db"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run Tests
        run: |
          pytest || echo "Tests completed"

      - name: Build Application Package
        run: |
          tar -czf app-build.tar.gz . --exclude='.git' --exclude='.github'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flask-app-build
          path: app-build.tar.gz

  deploy-staging:
    needs: build-and-test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: flask-app-build

      - name: Deploy to Staging
        run: |
          echo "Deploying to Staging Server IP: ${{ secrets.STAGING_HOST }}"

  deploy-production:
    needs: build-and-test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: flask-app-build

      - name: Deploy to Production
        run: |
          echo "Deploying to Production Server IP: ${{ secrets.PROD_HOST }}"
